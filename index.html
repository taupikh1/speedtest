<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speed Test Realtime</title>
<style>
:root{--bg:#070914;--card:#12162b;--ln:#232949;--tx:#eef0ff;--mu:#7f87ad;--dl:#22b8ff;--ul:#b36bff;--ok:#2ee59d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 60% at 50% 0,#141a3a 0,var(--bg) 60%) no-repeat,var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.w{max-width:460px;margin:0 auto}
h1{font-size:13px;letter-spacing:3px;text-align:center;color:var(--mu);margin:6px 0 4px;font-weight:600}
#ph{text-align:center;font-size:13px;letter-spacing:2px;color:var(--dl);height:18px;font-weight:700}
.gw{position:relative;margin:2px auto 0;max-width:340px}
svg{width:100%;display:block}
.gt{fill:none;stroke:var(--ln);stroke-width:14;stroke-linecap:round}
#ga{fill:none;stroke:var(--dl);stroke-width:14;stroke-linecap:round;stroke-dasharray:251.3;stroke-dashoffset:251.3;transition:stroke-dashoffset .18s linear,stroke .3s}
.gv{position:absolute;left:0;right:0;bottom:2px;text-align:center}
#v{font-size:60px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#u{color:var(--mu);font-size:15px;margin-top:2px}
.sc{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;padding:0 22px;margin-top:-2px}
canvas{width:100%;height:110px;background:var(--card);border-radius:16px;margin:14px 0 8px;display:block}
.bar{height:5px;background:var(--card);border-radius:3px;overflow:hidden}
#pb{height:100%;width:0;background:var(--ok);transition:width .2s}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.c{background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--ln)}
.c small{color:var(--mu);display:flex;align-items:center;gap:6px;font-size:12px}
.c small i{width:8px;height:8px;border-radius:50%;display:inline-block}
.c b{font-size:24px;font-variant-numeric:tabular-nums;display:block;margin-top:4px}
.c em{font-style:normal;color:var(--mu);font-size:12px}
details{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:4px 14px}
summary{padding:10px 0;color:var(--mu);font-size:14px;cursor:pointer;list-style:none}
.r{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;gap:10px}
.r span{color:var(--mu);font-size:14px}
select,input{background:#0b0e20;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px;font-size:15px;max-width:62%}
input{width:62%}
button{width:100%;margin-top:14px;padding:16px;border:0;border-radius:16px;font-size:17px;font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,var(--dl),#5b8cff);color:#04121c}
button.s{background:#ff5d6c;color:#fff}
#m{color:var(--mu);font-size:13px;text-align:center;margin-top:12px;min-height:34px;line-height:1.4}
</style>
</head>
<body>
<div class="w">
<h1>SPEED TEST</h1>
<div id="ph">SIAP</div>
<div class="gw">
<svg viewBox="0 0 200 112"><path class="gt" d="M20 100A80 80 0 0 1 180 100"/><path id="ga" d="M20 100A80 80 0 0 1 180 100"/></svg>
<div class="gv"><div id="v">0</div><div id="u">Mbps</div></div>
</div>
<div class="sc"><span>0</span><span id="mx">100</span></div>
<canvas id="cv"></canvas>
<div class="bar"><div id="pb"></div></div>
<div class="g">
<div class="c"><small><i style="background:var(--dl)"></i>Download</small><b id="rd">-</b><em id="rdp">&nbsp;</em></div>
<div class="c"><small><i style="background:var(--ul)"></i>Upload</small><b id="ru">-</b><em id="rup">&nbsp;</em></div>
<div class="c"><small>Ping</small><b id="rp">-</b><em>latensi minimum</em></div>
<div class="c"><small>Jitter</small><b id="rj">-</b><em>selisih antar-ping</em></div>
</div>
<details><summary>Pengaturan</summary>
<div class="r"><span>Server download</span><select id="sv"><option value="cf">Cloudflare</option><option value="custom">URL sendiri</option></select></div>
<div class="r" id="ur" style="display:none"><span>URL file</span><input id="url" placeholder="https://.../file.zip"></div>
<div class="r"><span>Koneksi</span><select id="cn"><option value="4">Multi (4)</option><option value="1">Tunggal</option></select></div>
<div class="r"><span>Durasi / fase</span><select id="du"><option value="8">8 detik</option><option value="12" selected>12 detik</option><option value="20">20 detik</option></select></div>
<div class="r"><span>Tes upload</span><select id="uo"><option value="1">Ya</option><option value="0">Tidak</option></select></div>
<div class="r"><span>Unit</span><select id="un"><option value="Mb">Mbps</option><option value="MB">MB/s</option></select></div>
</details>
<button id="bt">MULAI</button>
<div id="m"></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var S={on:false,live:false,total:0,err:null,ctrl:null,xhrs:[]};
var R={p:null,j:null,d:null,u:null},cur=0,pts=[],colr='#22b8ff',smax=0,blob=null;
$('sv').onchange=function(){$('ur').style.display=this.value==='custom'?'flex':'none'};
function U(){return $('un').value}
function cv(mbs){return U()==='MB'?mbs:mbs*8}
function f(x){return x>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(2)}
function unitTxt(){return U()==='MB'?'MB/s':'Mbps'}
function niceMax(x){var a=U()==='MB'?[2,5,10,25,50,100,250,500]:[10,25,50,100,250,500,1000,2500];for(var i=0;i<a.length;i++)if(x*1.1<=a[i])return a[i];return a[a.length-1]}
function dlUrl(){
  var r='r='+Math.random();
  if($('sv').value==='cf')return 'https://speed.cloudflare.com/__down?bytes=50000000&'+r;
  var u=$('url').value.trim();if(!u)throw new Error('Isi URL file dulu');
  return u+(u.indexOf('?')<0?'?':'&')+r;
}
function mkBlob(){
  if(blob)return blob;
  var a=new Uint8Array(4*1024*1024);
  for(var i=0;i<a.length;i+=65536)crypto.getRandomValues(a.subarray(i,i+65536));
  return blob=new Blob([a]);
}
function render(){
  var t=unitTxt();
  $('rd').textContent=R.d?f(cv(R.d.avg))+' '+t:'-';
  $('rdp').innerHTML=R.d?'puncak '+f(cv(R.d.peak)):'&nbsp;';
  $('ru').textContent=R.u?f(cv(R.u.avg))+' '+t:'-';
  $('rup').innerHTML=R.u?'puncak '+f(cv(R.u.peak)):'&nbsp;';
  $('rp').textContent=R.p==null?'-':R.p.toFixed(0)+' ms';
  $('rj').textContent=R.j==null?'-':R.j.toFixed(1)+' ms';
  gauge(cur);
}
function gauge(mbs){
  var d=cv(mbs);
  if(S.live){var m=niceMax(d);if(m>smax)smax=m}
  var m2=smax||niceMax(0);
  $('v').textContent=f(d);$('u').textContent=unitTxt();$('mx').textContent=m2;
  $('ga').style.strokeDashoffset=251.3*(1-Math.min(1,d/m2));
}
function chart(){
  var c=$('cv'),k=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  c.width=w*k;c.height=h*k;var g=c.getContext('2d');g.scale(k,k);
  g.strokeStyle='#232949';g.lineWidth=1;
  for(var i=1;i<4;i++){g.beginPath();g.moveTo(0,h*i/4);g.lineTo(w,h*i/4);g.stroke()}
  if(pts.length<2)return;
  var mx=Math.max.apply(null,pts)*1.15||1,n=Math.max(pts.length,60);
  g.beginPath();
  pts.forEach(function(p,i){var x=i/(n-1)*w,y=h-(p/mx)*(h-10)-5;i?g.lineTo(x,y):g.moveTo(x,y)});
  g.strokeStyle=colr;g.lineWidth=2.5;g.lineJoin='round';g.stroke();
  g.lineTo((pts.length-1)/(n-1)*w,h);g.lineTo(0,h);g.closePath();
  var gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,colr+'66');gr.addColorStop(1,colr+'05');
  g.fillStyle=gr;g.fill();
}
async function ping(){
  var t=[];
  for(var i=0;i<8&&S.on;i++){
    var s=performance.now();
    await fetch('https://speed.cloudflare.com/__down?bytes=0&r='+Math.random(),{cache:'no-store'});
    t.push(performance.now()-s);
    $('pb').style.width=(i+1)/8*100+'%';
  }
  t=t.slice(1);var j=0;
  for(var k=1;k<t.length;k++)j+=Math.abs(t[k]-t[k-1]);
  R.p=Math.min.apply(null,t);R.j=j/(t.length-1);render();
}
async function dlW(sig){
  while(S.live){
    var res=await fetch(dlUrl(),{signal:sig,cache:'no-store'});
    if(!res.ok||!res.body)throw new Error('Server menolak (HTTP '+res.status+')');
    var rd=res.body.getReader();
    while(S.live){var x=await rd.read();if(x.done)break;S.total+=x.value.length}
    try{rd.cancel()}catch(e){}
  }
}
function ulW(){
  return new Promise(function(done){
    (function loop(){
      if(!S.live)return done();
      var x=new XMLHttpRequest(),prev=0;S.xhrs.push(x);
      x.open('POST','https://speed.cloudflare.com/__up');
      x.upload.onprogress=function(e){S.total+=e.loaded-prev;prev=e.loaded};
      x.onload=loop;
      x.onerror=function(){if(S.live)S.err=new Error('Upload gagal (jaringan/server)');done()};
      x.onabort=function(){done()};
      x.send(mkBlob());
    })();
  });
}
function measure(kind){
  return new Promise(function(res){
    var dur=+$('du').value*1000,n=+$('cn').value,t0=performance.now(),last=t0,lb=0,ema=0,peak=0,wT=null,wB=0;
    S.total=0;S.live=true;S.err=null;S.ctrl=new AbortController();S.xhrs=[];pts=[];smax=0;cur=0;
    colr=kind==='d'?'#22b8ff':'#b36bff';
    $('ga').style.stroke=colr;$('ph').style.color=colr;$('ph').textContent=kind==='d'?'DOWNLOAD':'UPLOAD';
    var ws=[];
    for(var i=0;i<n;i++)ws.push(kind==='d'?dlW(S.ctrl.signal).catch(function(e){if(S.live&&e.name!=='AbortError')S.err=e}):ulW());
    var fin=false;
    function end(){
      if(fin)return;fin=true;clearInterval(tm);S.live=false;
      try{S.ctrl.abort()}catch(e){}S.xhrs.forEach(function(x){try{x.abort()}catch(e){}});
      var now=performance.now(),el=(now-t0)/1000,avg;
      if(wT!==null&&now-wT>1000)avg=(S.total-wB)/((now-wT)/1000);else avg=S.total/Math.max(el,.1);
      R[kind]={avg:avg/1e6,peak:peak};cur=avg/1e6;render();res();
    }
    var tm=setInterval(function(){
      var now=performance.now(),dt=(now-last)/1000;if(dt<0.12)return;
      var inst=(S.total-lb)/1e6/dt;last=now;lb=S.total;
      ema=ema?ema*0.55+inst*0.45:inst;cur=ema;
      var el=now-t0;
      if(el>1500&&wT===null){wT=now;wB=S.total}
      if(wT!==null&&ema>peak)peak=ema;
      pts.push(ema);
      var stable=wT!==null&&now-wT>800?(S.total-wB)/((now-wT)/1000)/1e6:ema;
      gauge(ema);$('pb').style.width=Math.min(100,el/dur*100)+'%';
      $('m').textContent=(kind==='d'?'Terunduh ':'Terkirim ')+(S.total/1e6).toFixed(1)+' MB · stabil '+f(cv(stable))+' '+unitTxt();
      chart();
      if(el>=dur||!S.on||(S.err&&S.total===0))end();
    },150);
    Promise.all(ws).then(end);
  });
}
function errMsg(e){
  var m=(e&&e.message)||String(e);
  if(/cloned/i.test(m))return 'Halaman ini sedang dibuka di dalam pratinjau Claude yang memblokir jaringan. Buka di Safari/Chrome.';
  if(/Failed to fetch|Load failed|NetworkError/i.test(m))return 'Tidak bisa terhubung ke server (offline, diblokir, atau server tanpa CORS).';
  return m;
}
async function start(){
  S.on=true;R={p:null,j:null,d:null,u:null};cur=0;pts=[];smax=0;render();chart();
  $('bt').textContent='BERHENTI';$('bt').className='s';$('m').textContent='';
  try{
    $('ph').style.color='#8a90b0';$('ph').textContent='PING';await ping();
    if(S.on)await measure('d');
    if(S.on&&!S.err&&$('uo').value==='1')await measure('u');
    $('ph').textContent=S.on?'SELESAI':'DIHENTIKAN';
    $('m').textContent=S.err?'Gagal: '+errMsg(S.err):(S.on?'Selesai. Angka besar adalah kecepatan stabil (tanpa 1,5 detik awal).':'Dihentikan.');
  }catch(e){$('ph').textContent='GAGAL';$('m').textContent='Gagal: '+errMsg(e)}
  S.on=false;S.live=false;$('pb').style.width='100%';$('bt').textContent='MULAI LAGI';$('bt').className='';
}
$('bt').onclick=function(){S.on?(S.on=false):start()};
$('un').onchange=render;
window.addEventListener('resize',chart);
render();chart();
</script>
</body>
</html>
